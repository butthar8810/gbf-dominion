<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="js/dominion.js"></script>

    <link rel="stylesheet" href="css/style.css">

    <title>Dominion</title>
</head>
<body onload="startGame()">
    <div class="supply-area">
        <div class="victory-point-area"></div>
        <div class="treasure-point-area"></div>
        <div class="kingdon-area"></div>
    </div>
    <div class="play-area">
        <div class="left-info">
            <div class="count-area">
                <div class="action-count">1</div>
                <div class="buy-count">2</div>
                <div class="moon-count">3</div>
            </div>
            <div class="point-area">
                <div class="point-count">1</div>
            </div>
            <div class="deck-area">
                <div class="deck-count">10</div>
            </div>
        </div>
    </div>


</body>
</html>
