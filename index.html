<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<script src="https://code.jquery.com/jquery-3.7.1.min.js"
		integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
	<script src="https://magicant.github.io/sjavascript/mt.js"></script>
	<script src="js/dominion.js"></script>

	<link rel="stylesheet" href="css/style.css">

	<title>Gura-Nion -グラニオン-</title>
</head>
<body onload="startGame()">
	<img class="back" src="images/back.jpg" alt="背景">
	<div class="supply-area">
		<div class="victory-point-area"></div>
		<div class="treasure-point-area"></div>
		<div class="kingdon-area"></div>
	</div>
	<div class="infomation-area">
		<div class="left-info">
			<div class="count-area">
				<div class="base-area action-area">
					<img src="images/action.jpg" alt="アクションポイント">
					<div class="base-count action-count">1</div>
				</div>
				<div class="base-area moon-area">
					<img src="images/moon.png" alt="ムーンポイント">
					<div class="base-count moon-count">0</div>
				</div>
				<div class="base-area moon-area">
					<img src="images/buy.jpg" alt="購入ポイント">
					<div class="base-count buy-count">1</div>
				</div>
			</div>
			<div class="base-area point-area">
				<img src="images/point.jpg" alt="勝利点">
				<div class="base-count point-count">1</div>
			</div>
			<div class="deck-area">
				<img src="images/deck.png" alt="デッキ">
				<div class="deck-count"></div>
			</div>
			<div class="phase-count"></div>
		</div>
		<div class="main-info">
			<div class="info-text"></div>
			<div class="play-area"></div>
		</div>
		<div class="right-info">
			<div class="phase-info">
				<button class="multiple-btn" onclick="pushMultiplebtn()">次のフェイズへ</button>
			</div>
			<div class="trash-info">
				<div class="discard-area">
					<img src="images/discard.png" alt="捨て札">
					<div class="discard-count">0</div>
				</div>
				<div class="trash-area">
					<img src="images/trash.png" alt="廃棄">
					<div class="trash-count">0</div>
				</div>
			</div>
			<div class="btn-info">
				<div class="btn-area setting-area">
					<img class="setting-open-btn" src="images/setting.png" alt="設定ボタン">
				</div>
			</div>
		</div>
	</div>
	<div class="hand-area">
		<div class="hand-info"></div>
	</div>
	<div class="explanation-modal">
		<div class="explanation-modal-body"></div>
	</div>
	<div class="modal">
		<div class="modal-body">
			<div class="modal-title"></div>
			<div class="modal-content"></div>
		</div>
	</div>
	<div class="setting-modal">
		<div class="setting-modal-body">
			<button class="setting-btn menu-btn">メニュー</button>
			<button class="setting-btn rule-btn">ルール</button>
			<button class="setting-btn restart-btn">はじめから</button>
			<button class="setting-btn close-btn">閉じる</button>
		</div>
	</div>


</body>
</html>
